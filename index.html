<!DOCTYPE html>
<html>

<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora del volumen del tanque - Subsecretaría de Servicios Públicos Zona Norte - La Matanza</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="favicon.png" type="image/png">
</head>

<body>

    <header>
        <div class="logo">
            <img src="images/header.png" id="image-header" alt="Imagen del header">
        </div>
    </header>

    <main>

        <div class="calculator-container">

            <div class="input-section">
                <div class="input-group">
                    <label for="radius">Radio del tanque (m)</label>
                    <input type="number" id="radius" value="1.03" step="0.01" min="0" max="10">
                </div>

                <div class="input-group">
                    <label for="length">Longitud del tanque (m)</label>
                    <input type="number" id="length" value="3.6" step="0.01" min="0" max="10">
                </div>

                <div class="input-group">
                    <label for="fluidHeight">Altura de carga (m)</label>
                    <input type="number" id="fluidHeight" value="2.06" step="0.01" min="0">
                </div>

                <div id="zona-calculo">
                </div>
            </div>

            <div class="results-section">
                <div id="result"></div>
                <!--<canvas id="tankCanvas" width="300" height="200"></canvas>-->

            </div>
        </div>

    </main>

    <footer>
        <p class="footer-space"> </p>
        <div class="footer-element">
            <span id="text-footer">©</span><img src="images/logo.png" id="image-footer"
                alt="Imagen del footer">
        </div>
    </footer>

    <script src="js/calculator.js"></script>
    <script src="js/drawing.js"></script>
    <script src="js/reload.js"></script>
    <script src="js/warning.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            // Inicializa el calculador
            setupCalculator();
        }); 
    </script>

</body>

</html>
